name: Sync to Gitee

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          # 这里的 GITEE_TOKEN 就是刚才在第一步和第二步配置的名字
          SSH_PRIVATE_KEY: ""
        with:
          # 换成你的 GitHub 仓库地址
          source-repo: "git@github.com:ai123lp456/LimeLink.git"
          # 换成你的 Gitee 仓库地址
          destination-repo: "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/ai123lp456/lime-link.git"